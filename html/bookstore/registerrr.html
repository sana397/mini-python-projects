<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register Form</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      padding: 2.5rem 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 420px;
    }

    h2 {
      text-align: center;
      margin-bottom: 1.8rem;
      color: #333;
      font-size: 1.9rem;
    }

    .form-group {
      margin-bottom: 1.4rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #555;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 3rem;
    }

    .error {
      color: #e74c3c;
      font-size: 0.85rem;
      margin-top: 0.35rem;
      display: none;
    }

    button {
      width: 100%;
      padding: 1rem;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.25s;
      margin-top: 1rem;
    }

    button:hover {
      background: #5a67d8;
    }

    .login-link {
      text-align: center;
      margin-top: 1.3rem;
      color: #666;
      font-size: 0.95rem;
    }

    .login-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Create Account</h2>

    <form id="registerForm" onsubmit="return validateForm(event)">

      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="John Doe" required>
        <div class="error" id="nameError">Please enter your full name</div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
        <div class="error" id="emailError">Please enter a valid email</div>
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="johndoe123" required minlength="4">
        <div class="error" id="usernameError">Username must be at least 4 characters</div>
      </div>

      <div class="form-group password-wrapper">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required minlength="8">
        <div class="error" id="passwordError">Password must be at least 8 characters</div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
        <div class="error" id="confirmError">Passwords do not match</div>
      </div>

      <button type="submit">Sign Up</button>

      <div class="login-link">
        Already have an account? <a href="#">Login</a>
      </div>

    </form>
  </div>

  <script>
    function validateForm(event) {
      event.preventDefault();

      // Reset errors
      document.querySelectorAll('.error').forEach(el => el.style.display = 'none');

      let isValid = true;

      const fullname = document.getElementById('fullname').value.trim();
      const email = document.getElementById('email').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // Basic validations
      if (fullname.length < 2) {
        document.getElementById('nameError').style.display = 'block';
        isValid = false;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById('emailError').style.display = 'block';
        isValid = false;
      }

      if (username.length < 4) {
        document.getElementById('usernameError').style.display = 'block';
        isValid = false;
      }

      if (password.length < 8) {
        document.getElementById('passwordError').style.display = 'block';
        isValid = false;
      }

      if (password !== confirmPassword) {
        document.getElementById('confirmError').style.display = 'block';
        isValid = false;
      }

      if (isValid) {
        alert('Registration successful! (This is just a demo)');
        // Here you would normally send data to backend
        // e.g. fetch('/api/register', { method: 'POST', body: new FormData(form) })
      }

      return false;
    }
  </script>

</body>
</html>
