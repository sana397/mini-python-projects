<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Number to Words</title>
    <link rel="stylesheet" href="style.css">
    <script>
    function numberToWords(num) {
        var a = ['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
        var b = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
        if (num == 0) return 'zero';
        if (num < 20) return a[num];
        if (num < 100) return b[Math.floor(num/10)] + (num%10 ? '-' + a[num%10] : '');
        if (num < 1000) return a[Math.floor(num/100)] + ' hundred' + (num%100 ? ' and ' + numberToWords(num%100) : '');
        return 'Invalid';
    }
    function showWords() {
        var n = document.getElementById('num').value;
        if (!/^[0-9]{1,3}$/.test(n)) {
            alert('Enter a number from 0 to 999 only!');
            document.getElementById('words').innerText = '';
            return;
        }
        document.getElementById('words').innerText = numberToWords(parseInt(n));
    }
    </script>
</head>
<body>
    <h2>Number to Words</h2>
    <input type="text" id="num" maxlength="3" placeholder="0-999">
    <button onclick="showWords()">Show in Words</button>
    <div id="words" style="margin-top:1em; font-weight:bold;"></div>
</body>
</html>
