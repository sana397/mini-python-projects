<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script>
    function calc(op) {
        var a = parseFloat(document.getElementById('a').value);
        var b = parseFloat(document.getElementById('b').value);
        var res;
        if (isNaN(a) || isNaN(b)) { alert('Enter valid numbers!'); return; }
        switch(op) {
            case '+': res = a + b; break;
            case '-': res = a - b; break;
            case '*': res = a * b; break;
            case '/': res = b !== 0 ? a / b : 'Infinity'; break;
        }
        document.getElementById('result').value = res;
    }
    </script>
</head>
<body>
    <h2>Simple Calculator</h2>
    <input type="text" id="a" size="5"> 
    <select id="op">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>
    <input type="text" id="b" size="5">
    <button onclick="calc(document.getElementById('op').value)">Calculate</button>
    <input type="text" id="result" size="10" readonly>
</body>
</html>
